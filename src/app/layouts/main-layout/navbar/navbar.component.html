<header class="sticky top-0 z-40 border-b border-slate-200/90 bg-white/95 backdrop-blur">
  <nav class="bg-neutral-primary w-full">
    <div
      class="mx-auto flex max-w-7xl items-center justify-between gap-2 px-2 py-1.5 sm:gap-3 sm:px-3"
    >
      <div class="flex gap-2 items-center">
        <img
          class="size-9 rounded-xl object-cover"
          src="./images/social-media-logo.png"
          alt="{{ APP_NAME }} Logo"
        />
        <span class="hidden text-xl font-extrabold text-slate-900 sm:block">{{ APP_NAME }}</span>
      </div>

      <nav
        class="flex min-w-0 items-center gap-1 overflow-x-auto rounded-2xl border border-slate-200 bg-slate-50/90 px-1 py-1 sm:px-1.5-4"
      >
        <a
          routerLink="/feed"
          routerLinkActive="text-[#1f6fe5]"
          class="flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-sm font-extrabold transition sm:gap-2 sm:px-3.5 hover:bg-white/90 cursor-pointer"
        >
          <i class="fa-regular fa-house text-xl"></i>
          <span class="hidden sm:block text-xs">Feed</span>
        </a>
        <a
          routerLink="/profile"
          routerLinkActive="text-[#1f6fe5]"
          class="flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-sm font-extrabold transition sm:gap-2 sm:px-3.5 hover:bg-white/90 cursor-pointer"
        >
          <i class="fa-regular fa-user text-xl"></i>
          <span class="hidden sm:block text-xs">Profile</span>
        </a>
        <a
          routerLink="/notifications"
          routerLinkActive="text-[#1f6fe5]"
          class="relative flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-sm font-extrabold transition sm:gap-2 sm:px-3.5 hover:bg-white/90 cursor-pointer w-full overflow-hidden"
        >
          <i class="relative fa-regular fa-comment text-xl">
            @if (unreadNotificationsCount > 0) {
              <div
                class="absolute top-0 -right-2 -translate-y-1/2 p-1 rounded-full bg-red-500 text-white text-[8px] font-bold"
              >
                <span> {{ unreadNotificationsCount }}</span>
              </div>
            }
          </i>
          <span class="hidden sm:block text-xs w-full">Notifications</span>
        </a>
      </nav>

      <div class="flex items-center space-x-3 rtl:space-x-reverse relative">
        <button
          (click)="toggleDropdown()"
          type="button"
          class="flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-2 py-1.5 transition hover:bg-slate-100 cursor-pointer"
          id="user-menu-button"
        >
          <span class="sr-only">Open user menu</span>
          <img
            class="w-8 h-8 rounded-full"
            [src]="user.photo || '/assets/images/profile.png'"
            alt="user photo"
          />
          <span class="hidden md:block">{{ user.name }}</span>
          <i class="fa-solid fa-bars text-gray-400"></i>
        </button>
        <!-- Dropdown menu -->
        <div
          [class.hidden]="!isDropdownOpen"
          class="z-100 bg-white rounded-lg border-slate-200 absolute right-0 top-full mt-1 bg-neutral-primary-medium border border-default-medium rounded-base shadow-lg w-44"
          id="user-dropdown"
        >
          <ul class="p-2 text-sm text-body font-medium" aria-labelledby="user-menu-button">
            <li>
              <button
                routerLink="/profile"
                class="flex w-full items-center gap-2 rounded px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 cursor-pointer"
              >
                <i class="fa-regular fa-user"></i>
                Profile
              </button>
            </li>
            <li>
              <button
                routerLink="/settings"
                class="flex w-full items-center gap-2 rounded mb-2 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 cursor-pointer"
              >
                <i class="fa-solid fa-gear"></i>
                Settings
              </button>
            </li>
            <li class="pt-2 border-t border-gray-200">
              <a
                (click)="onLogout($event)"
                class="inline-flex items-center w-full p-2 hover:bg-rose-50 text-rose-600 rounded cursor-pointer"
                >Logout</a
              >
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>
</header>
