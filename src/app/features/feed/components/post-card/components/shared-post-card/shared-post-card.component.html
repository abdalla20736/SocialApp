<div class="p-3">
  <div class="flex items-center gap-2">
    <img [src]="sharedPost.user.photo" [alt]="sharedPost.user.name" class="rounded-full" />
    <div>
      <h3 class="font-bold">{{ sharedPost.user.name }}</h3>
      <p class="text-slate-500">Original post</p>
    </div>
  </div>
  <div>
    <app-post-image [imageUrl]="sharedPost.image!" [imageAlt]="sharedPost.user.name!">
    </app-post-image>
  </div>
</div>
