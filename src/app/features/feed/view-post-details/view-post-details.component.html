<div class="mx-auto max-w-3xl">
  <button
    (click)="navigateBack()"
    class="flex items-center gap-2 text-sm font-bold hover:text-gray-800 duration-200 text-slate-700 transition hover:bg-slate-50 mb-4 bg-white px-3 py-2 rounded border border-slate-200"
  >
    <i class="fa-solid fa-arrow-left"></i>
    Back
  </button>
  @if (isLoading) {
    <div
      class="bg-white rounded-2xl p-7 flex items-center justify-center shadow-sm border border-slate-200 w-full max-w-2xl"
    >
      <p class="text-slate-500">Loading post...</p>
    </div>
  } @else {
    <app-post-card [post]="post"></app-post-card>
  }
</div>
