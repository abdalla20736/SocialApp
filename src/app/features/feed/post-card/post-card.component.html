<div #modalContainer class="post-card rounded-2xl border border-slate-200 bg-white shadow-sm">
  <div class="p-4 mb-0">
    <div class="flex gap-2 items-center mb-3">
      <div class="avatar">
        <img
          [alt]="userName"
          class="size-12 rounded-full border border-gray-400/20 object-cover shadow-sm"
          [src]="userPhoto || './images/post-default-profile.png'"
        />
      </div>
      <div class="author-info w-full">
        <button
          [routerLink]="isPostOwner() ? '/profile' : '/user/' + post?.user?._id"
          class="text-sm font-semibold text-foreground hover:underline"
        >
          {{ userName }}
        </button>
        <div>
          <div class="flex items-center gap-1 text-xs justify-between text-muted-foreground">
            <div class="flex items-center gap-1">
              <span>{{ userName }}</span>
              <span class="mb-1">.</span>
              <button
                (click)="openPost()"
                class="rounded px-0.5 py-0.5 text-xs font-semibold text-slate-500 transition hover:bg-slate-100 hover:text-slate-700 hover:underline"
              >
                {{ post?.createdAt | timeago }}
              </button>
              <span class="mb-1">.</span>
              <div
                class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-normal text-slate-700"
              >
                <i class="fa-solid fa-earth-americas text-2xs"></i>
                <select
                  class="bg-transparent outline-none border-0 ring-0 text-xs p-0 px-2 cursor-pointer"
                >
                  <option value="public">Public</option>
                  <option value="following">Followers</option>
                  <option value="only_me">Only me</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div>
        <button
          id="postOptionsButton-{{ post?._id }}"
          [attr.data-dropdown-toggle]="'postOptionsDropdown-' + post?._id"
          class="ml-2 p-1 rounded-full text-gray-500 hover:bg-gray-100 transition-colors cursor-pointer"
          title="Post options"
          data-dropdown-placement="bottom-end"
        >
          <i class="fa-solid fa-ellipsis text-sm"></i>
        </button>

        <div
          id="postOptionsDropdown-{{ post?._id }}"
          class="z-10 hidden bg-neutral-primary-medium border border-default-medium rounded-base shadow-lg w-44"
        >
          <ul
            class="py-2 text-sm text-body font-medium"
            aria-labelledby="postOptionsButton-{{ post?._id }}"
          >
            <li>
              <button
                (click)="toggleBookmarkPost()"
                class="inline-flex gap-2 items-center w-full p-2 hover:bg-slate-50 rounded"
              >
                <i class="fa-regular fa-bookmark"></i>
                @if (isSavingPost) {
                  Saving...
                } @else if (isPostSaved()) {
                  Unsave post
                } @else {
                  Save post
                }
              </button>
            </li>
            @if (isPostOwner()) {
              <li>
                <button class="inline-flex gap-2 items-center w-full p-2 hover:bg-slate-50 rounded">
                  <i class="fa-regular fa-pen-to-square"></i>
                  Edit post
                </button>
              </li>
              <li>
                <button
                  class="inline-flex gap-2 items-center w-full p-2 hover:bg-rose-50 text-rose-600 rounded"
                >
                  <i class="fa-solid fa-trash"></i>
                  Delete post
                </button>
              </li>
            }
          </ul>
        </div>
      </div>
    </div>
    <div class="">
      <p class="text-sm">{{ post?.body || 'test' }}</p>
      @if (isPostSaved()) {
        <div
          class="mt-3 inline-flex items-center gap-1 rounded-full bg-[#e7f3ff] px-2.5 py-1 text-[11px] font-bold text-[#1877f2]"
        >
          <i class="fa-regular fa-bookmark"></i>
          Saved
        </div>
      }
    </div>
  </div>

  <div class="px-4 pb-2 pt-3 text-sm text-slate-500">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="h-5 w-5 rounded-full bg-blue-500 flex items-center justify-center">
          <i class="fa-regular fa-thumbs-up text-white text-2xs"></i>
        </span>
        <button class="hover:underline hover:text-[#1877f2] font-medium transition cursor-pointer">
          {{ post?.likesCount }} likes
        </button>
      </div>
      <div class="flex flex-wrap items-center gap-2 text-xs sm:gap-3 sm:text-sm">
        <div class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-normal">
          <i class="fa-solid fa-share-square"></i>
          <span>{{ post?.sharesCount }} shares</span>
        </div>
        <span>{{ post?.commentsCount }} comments</span>
        <button
          (click)="openPost()"
          class="rounded-md px-2 py-1 text-xs font-semibold text-[#1877f2] hover:bg-[#e7f3ff] cursor-pointer"
        >
          View details
        </button>
      </div>
    </div>
  </div>
  <div class="border-b border-slate-200 mx-4"></div>

  <div class="flex items-center p-1 *:transition-all *:hover:cursor-pointer *:duration-200 *:p-2">
    <button
      (click)="toggleLikePost()"
      [ngClass]="{
        'bg-[#e7f3ff] text-[#1877f2]': isPostLikedByCurrentUser(),
        'text-slate-600 hover:bg-slate-100': !isPostLikedByCurrentUser(),
      }"
      class="w-full flex items-center justify-center gap-1 text-sm font-normal rounded"
    >
      <i class="fa-regular fa-thumbs-up text-lg"></i>
      Like
    </button>
    <button
      class="w-full text-gray-600 flex items-center justify-center gap-1 text-sm font-normal rounded"
    >
      <i class="fa-regular fa-comment text-lg"></i>
      Comment
    </button>
    <button
      class="w-full text-gray-600 flex items-center justify-center gap-1 text-sm font-normal rounded"
    >
      <i class="fa-solid fa-share-nodes text-lg"></i>
      Share
    </button>
  </div>
  <div class="pt-4 space-y-6">
    @if (getRemainingCommentsCount() > 0) {
      <button
        class="hover:underline transition-colors duration-200"
        [class.text-blue-600]="!isShowedAllComments"
        [class.text-gray-500]="isShowedAllComments"
        (click)="toggleShowAllComments()"
      >
        {{
          isShowedAllComments
            ? 'Show Less'
            : 'Show All Comments ' + getRemainingCommentsCount() + ' more'
        }}
      </button>
    }
  </div>
  <div class="flex gap-2">
    <img
      src="./images/comment-default-profile.png"
      alt="commenter-1"
      class="size-10 rounded-full object-cover"
    />
    <div class="w-full">
      <div class="relative">
        <input
          type="text"
          name="comment"
          id="comment"
          placeholder="Write a comment..."
          class="w-full px-4 py-2.5 pr-12 bg-gray-100 rounded-full border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all text-sm placeholder:text-gray-500"
        />
        <button
          type="submit"
          class="absolute right-2 top-1/2 -translate-y-1/2 size-8 rounded-full text-blue-500 hover:bg-blue-50 flex items-center justify-center transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
      </div>
    </div>
  </div>
</div>
