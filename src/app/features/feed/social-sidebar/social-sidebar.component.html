<div class="space-y-3 block lg:hidden">
  <button
    (click)="ToggleSocialBar()"
    type="button"
    class="inline-flex w-full items-center justify-between rounded-2xl border border-slate-200 bg-white px-4 py-3 text-left shadow-sm"
  >
    <span class="inline-flex items-center gap-2 text-sm font-extrabold text-slate-900">
      <i class="fa-solid fa-users text-[#1877f2]"></i>
      Suggested Friends</span
    ><span class="inline-flex items-center gap-2"
      ><span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-bold text-slate-600">5</span
      ><span class="text-xs font-bold text-[#1877f2]">Show</span></span
    >
  </button>
</div>
<aside [class.hidden]="!isShowedSocialBar" class="h-fit xl:sticky xl:block">
  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="mb-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-users text-[#1877f2]"></i>
        <h3 class="text-base font-extrabold text-slate-900">Suggested Friends</h3>
      </div>
      <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-bold text-slate-600">5</span>
    </div>
    <div class="mb-3">
      <label class="relative block">
        <i
          class="fa-solid fa-magnifying-glass text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"
        ></i>
        <input
          placeholder="Search friends..."
          class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-sm text-slate-700 outline-none focus:border-[#1877f2] focus:bg-white"
          value=""
      /></label>
    </div>
    <div class="space-y-3">
      <app-suggestion-card></app-suggestion-card>
    </div>
    <button
      class="mt-3 inline-flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-100"
    >
      View more
    </button>
  </div>
</aside>
