<div class="post-card p-8 bg-white rounded-2xl shadow-lg space-y-5">
  <div class="flex gap-2 items-center">
    <div class="avatar">
      <img
        alt=""
        class="size-12 rounded-full border border-gray-400/20 object-cover shadow-sm"
        [src]="post.user.photo || './images/post-default-profile.png'"
      />
    </div>
    <div class="author-info">
      <h3 class="font-semibold">{{ post.user.name }}</h3>
      <time class="block text-sm text-gray-500 -mt-0.5 hover:underline" title="Feb 5, 2026, 4:01 AM"
        ><a [routerLink]="'/post/' + post._id" data-discover="true">last week</a></time
      >
    </div>
  </div>
</div>
