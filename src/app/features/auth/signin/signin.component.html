<div class="min-h-screen flex mt-10 items-center flex-col">
  <h1 class="text-center text-5xl text-blue-700 mb-8">Linked Posts</h1>
  <div class="min-w-10 w-11/12 lg:w-5/12 bg-white rounded-[5px] p-8">
    <h2 class="text-2xl text-blue-700 mb-3">Login Now</h2>
    <form>
      <div class="mb-6">
        <input
          type="email"
          id="email"
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
          placeholder="Type your email..."
          required
        />
      </div>
      <div class="mb-6">
        <input
          type="password"
          id="password"
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
          placeholder="Type your password"
          required
        />
      </div>

      <button
        type="submit"
        class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-5 py-2.5 focus:outline-none"
      >
        Signin
      </button>
      <div class="mt-3">
        <p class="text-gray-400 font-medium">
          Not registered?
          <a routerLink="/signup" class="text-blue-700">Create account</a>
        </p>
      </div>
    </form>
  </div>
</div>
